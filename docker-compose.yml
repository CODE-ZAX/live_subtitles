services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - whisper_models:/root/.cache/whisper
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - WHISPER_CACHE_DIR=/root/.cache/whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whisper_models:

